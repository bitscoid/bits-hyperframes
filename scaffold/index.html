<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP is vendored in assets/vendor/, not fetched at render time:
         the render contract forbids network fetches, and an offline render
         machine would otherwise produce a dead composition.
         Get it once: cp node_modules/gsap/dist/gsap.min.js assets/vendor/ -->
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- The register, chosen from the topic in stage 4. Empty on purpose:
         qc/type_gate.py fails until it is set, and js/apply-type-preset.js
         throws on an empty key so a render cannot quietly fall back to the CSS
         defaults. This block MUST stay above the script below: loaded first, it
         read an undefined key and every film shipped the same pairing. -->
    <script>
      window.BITS_TYPE_PRESET = 'handwritten';
    </script>
    <!-- Reads the key above and sets --font-display/-meta/-accent and their
         weights. Declares no @font-face: `hyperframes check` lints this file,
         not the DOM. -->
    <script src="js/apply-type-preset.js"></script>
    <style>
      :root {
        /* Replace all three with the film's own palette. */
        --ground: #0b0b0f;
        --ink: #f5f1ea;
        --accent: #c63b2b;

        /*
         * Font roles. Set at runtime by js/apply-type-preset.js from the preset,
         * which is why no family is hardcoded here: a default in the file is the
         * cheapest path, and the cheapest path is what made every film look
         * identical. The `inherit` values only keep the custom properties valid
         * if the script throws before setting them — the render stops there.
         */
        --font-display: inherit;
        --font-meta: inherit;
        --font-accent: inherit;
        --font-display-weight: 400;
        --font-meta-weight: 400;
        --font-accent-weight: 400;
      }

      /*
       * Every family a preset can name must be declared HERE, statically:
       * `hyperframes check` lints this file, not the DOM, so a face added by
       * script is invisible to it and fails `font_family_without_font_face`.
       *
       * `font-family` is the name the font itself declares, not the file name.
       * Measured trap: declaring 'Baloo2' or 'SpaceGrotesk' loads the file under
       * a name no CSS rule asks for, so the preset renders in the fallback with
       * no error anywhere.
       *
       * Variable files carry a weight range; a static file carries one weight,
       * because claiming a range on a static face makes the browser fake-bold it.
       *
       * The families HyperFrames bundles (Inter, Poppins, Nunito, JetBrains
       * Mono, Space Mono, IBM Plex Mono, Montserrat, …) need no rule.
       *
       * Delete a font file this film does not use, and its rule with it.
       */
      @font-face { font-family: 'Fredoka';           src: url('assets/fonts/Fredoka.ttf')         format('truetype'); font-weight: 300 700; font-display: block; }
      @font-face { font-family: 'Baloo 2';           src: url('assets/fonts/Baloo2.ttf')          format('truetype'); font-weight: 400 800; font-display: block; }
      @font-face { font-family: 'Shrikhand';         src: url('assets/fonts/Shrikhand.ttf')       format('truetype'); font-weight: 400;     font-display: block; }
      @font-face { font-family: 'Caveat';            src: url('assets/fonts/Caveat.ttf')          format('truetype'); font-weight: 400 700; font-display: block; }
      @font-face { font-family: 'Patrick Hand';      src: url('assets/fonts/PatrickHand.ttf')     format('truetype'); font-weight: 400;     font-display: block; }
      @font-face { font-family: 'Fraunces';          src: url('assets/fonts/Fraunces.ttf')        format('truetype'); font-weight: 100 900; font-display: block; }
      @font-face { font-family: 'Libre Caslon Text'; src: url('assets/fonts/LibreCaslonText.ttf') format('truetype'); font-weight: 400 700; font-display: block; }
      @font-face { font-family: 'Anton';             src: url('assets/fonts/Anton.ttf')           format('truetype'); font-weight: 400;     font-display: block; }
      @font-face { font-family: 'Space Grotesk';     src: url('assets/fonts/SpaceGrotesk.ttf')    format('truetype'); font-weight: 300 700; font-display: block; }
      @font-face { font-family: 'Kalam';             src: url('assets/fonts/Kalam-Bold.ttf')      format('truetype'); font-weight: 700;     font-display: block; }
      @font-face { font-family: 'Indie Flower';      src: url('assets/fonts/IndieFlower.ttf')     format('truetype'); font-weight: 400;     font-display: block; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground); color: var(--ink);
        font-family: var(--font-display);
      }
      #root { position: relative; width: 1080px; height: 1920px; }

      /* Safe box: x 120..780, y 240..1260 on 1080x1920.
         Derived from @hyperframes/core/dist/safeAreas.js — its TikTok band is
         declared at 720x1280 as [top,bottom,left,right] = [160,560,80,640] and
         [560,840,80,520]; scaled to 1080x1920 that is x 120..780, y 240..1260.
         Measured: L110 flagged / L130 clean, T240 flagged / T300 clean,
         B1240 flagged / B1200 clean, R780 flagged. It is the strictest of the
         three platforms, so fitting it fits Reels and Shorts too. */

      .clip { position: absolute; }

      .meta {
        left: 128px; top: 300px;
        font-family: var(--font-meta);
        font-weight: var(--font-meta-weight);
        font-size: 28px; letter-spacing: 6px; text-transform: uppercase;
      }

      /* The card IS the word: one element, so the contrast gate measures the
         accent fill it actually renders on. Measured trap: with the accent block
         as a separate sibling behind the text, the gate read the page background
         and reported 1.01:1 for text that is plainly legible. */
      .card {
        left: 140px; top: 880px;
        width: 620px; min-height: 250px;
        border-radius: 16px;
        background: var(--accent);
        color: #14060a;
        font-weight: var(--font-display-weight); font-size: 104px; line-height: 1.05;
        letter-spacing: -1px;
        display: flex; align-items: center;
        padding: 24px 32px;
      }

      /*
       * The accent layer: a handwritten annotation that sits beside the display
       * word. Three registers in one frame is what stops the film reading as a
       * single-font template — display (rounded), meta (mono), accent (hand).
       * Rotated a few degrees, because a hand does not write perfectly level.
       */
      .hand {
        font-family: var(--font-accent);
        font-weight: var(--font-accent-weight);
        font-size: 64px;
        line-height: 1;
        color: var(--accent);
        transform: rotate(-4deg);
        transform-origin: left center;
      }

      .title {
        left: 128px; top: 560px;
        font-family: var(--font-display);
        font-weight: var(--font-display-weight);
        font-size: 72px; line-height: 1.08;
      }

      /* A shape that moves for the whole film. Measured reason: the card only
         appears at `wordAt`, so the 0.4 s between the cut and the word showed a
         single small label and nothing else — the contact sheet caught it as a
         near-empty thumbnail. This rule also guarantees the encoder always sees
         motion in position. Sits inside the safe band (y 1230..1236 < 1260). */
      .rule {
        left: 140px; top: 1230px;
        height: 6px; width: 620px;
        border-radius: 3px;
        background: var(--accent);
        opacity: 0.55;
        transform-origin: left center;
        transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="9.6"
      data-width="1080"
      data-height="1920"
    >
      <!--
        data-duration = last beat end (7.0 + 2.6), never the orientation cap and
        never plus a tail that no clip fills. Measured: a root of 10.5 s against
        a last beat ending at 9.6 s left 0.9 s of empty frame, and the contact
        sheet came back with two blank thumbnails.
      -->

      <!-- Lead-in: the title card, while nothing is narrated. -->
      <div id="title" class="clip title" data-start="0" data-duration="1.7" data-track-index="0">
        Kenapa kopi<br />bikin ngantuk?
      </div>

      <!-- Beat 1 — the word lands at 1.55 s. -->
      <div id="b1card" class="clip card" data-start="1.0" data-duration="3.2" data-track-index="1">ngantuk</div>
      <div id="b1meta" class="clip meta" data-start="1.0" data-duration="3.2" data-track-index="2">hook</div>
      <div id="b1hand" class="clip hand" data-start="1.0" data-duration="3.2" data-track-index="3" style="left: 160px; top: 1150px">sebenarnya</div>

      <!-- Beat 2 — word at 4.72 s. -->
      <div id="b2card" class="clip card" data-start="4.2" data-duration="2.8" data-track-index="1">adenosin</div>
      <div id="b2meta" class="clip meta" data-start="4.2" data-duration="2.8" data-track-index="2">b1</div>
      <div id="b2hand" class="clip hand" data-start="4.2" data-duration="2.8" data-track-index="3" style="left: 160px; top: 1150px">bukan itu</div>

      <!-- Beat 3 — word at 7.46 s; the closing line holds ≥2 s. -->
      <div id="b3card" class="clip card" data-start="7.0" data-duration="2.6" data-track-index="1">6 jam</div>
      <div id="b3meta" class="clip meta" data-start="7.0" data-duration="2.6" data-track-index="2">close</div>
      <div id="b3hand" class="clip hand" data-start="7.0" data-duration="2.6" data-track-index="3" style="left: 160px; top: 1150px">ini yang penting</div>

      <!-- Narration. assets/ is read by relative path. -->
      <div id="rule" class="clip rule" data-start="0" data-duration="9.6" data-track-index="9"></div>

      <audio id="vo" data-start="0" data-duration="8" data-track-index="10" src="assets/voiceover.wav"></audio>
    </div>

    <script>
      /*
       * The render contract. Every clip is positioned by ONE paused timeline,
       * registered under the root's data-composition-id.
       *
       * Measured trap: `window.__hf = {seek(t)}` produces a STATIC video with no
       * error at all — the element sat at the same x in every frame until this
       * was changed to `window.__timelines[id] = gsap.timeline()`.
       */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const beats = [
        { id: 'b1', start: 1.0, wordAt: 1.55, duration: 3.2 },
        { id: 'b2', start: 4.2, wordAt: 4.72, duration: 2.8 },
        { id: 'b3', start: 7.0, wordAt: 7.46, duration: 2.6 },
      ];

      beats.forEach((b) => {
        // Reveal 80 ms before the word so the card has landed by the time it is
        // spoken — a deliberate pre-roll, not a defect. GUIDE §7 forbids text that
        // is *plainly* early; 80 ms is under one frame of perception, and the gate
        // samples at -150 ms so it still catches a real mistake.
        const reveal = b.wordAt - 0.08;
        tl.set('#' + b.id + 'card', { opacity: 0 }, 0);
        tl.fromTo(
          '#' + b.id + 'card',
          { opacity: 0, scale: 0.94, transformOrigin: 'left center' },
          { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out' },
          reveal
        );
        // the annotation writes in just after the card lands
        tl.set('#' + b.id + 'hand', { opacity: 0 }, 0);
        tl.fromTo(
          '#' + b.id + 'hand',
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' },
          reveal + 0.18
        );
        // Continuous drift for the WHOLE beat: a drift that stops early leaves
        // identical frames and the encoder reports a freeze.
        tl.fromTo(
          '#' + b.id + 'card',
          { x: 0, y: 0 },
          { x: 40, y: -16, duration: b.duration, ease: 'sine.inOut' },
          b.start
        );
      });

      // The progress rule: continuous motion for every frame of the film, and
      // something on screen during the 0.4 s before each word lands.
      // Contract rule 6: animate a transform, never width/height/left/top.
      tl.fromTo('#rule', {scaleX: 0}, {scaleX: 1, duration: 9.6, ease: 'none'}, 0);

      tl.to('#title', { opacity: 0, duration: 0.35, ease: 'power2.in' }, 1.6);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
