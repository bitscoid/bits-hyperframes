<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP is vendored in assets/vendor/, not fetched at render time:
         the render contract forbids network fetches, and an offline render
         machine would otherwise produce a dead composition.
         Get it once: cp node_modules/gsap/dist/gsap.min.js assets/vendor/ -->
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- The register, chosen from the topic in stage 4. Empty on purpose:
         qc/type_gate.py fails until it is set, and js/apply-type-preset.js
         throws on an empty key so a render cannot quietly fall back to the CSS
         defaults. This block MUST stay above the script below: loaded first, it
         read an undefined key and every film shipped the same pairing. -->
    <script>
      /*
       * Empty on purpose. qc/type_gate.py fails until this is set, because the
       * cheapest path is keeping whatever the scaffold shipped — and that is how
       * every film came out with the same pairing. Choose the topic's register
       * (js/type-presets.mjs), or 'custom' + window.BITS_TYPE_CUSTOM.
       */
      window.BITS_TYPE_PRESET = '';
    </script>
    <!-- Reads the key above and sets --font-display/-meta/-accent and their
         weights. Declares no @font-face: `hyperframes check` lints this file,
         not the DOM. -->
    <script src="js/apply-type-preset.js"></script>
    <style>
      :root {
        /* Replace all three with the film's own palette. */
        --ground: #0b0b0f;
        --ink: #f5f1ea;
        --accent: #c63b2b;

        /*
         * Font roles. Set at runtime by js/apply-type-preset.js from the preset,
         * which is why no family is hardcoded here: a default in the file is the
         * cheapest path, and the cheapest path is what made every film look
         * identical. The `inherit` values only keep the custom properties valid
         * if the script throws before setting them — the render stops there.
         */
        --font-display: inherit;
        --font-meta: inherit;
        --font-accent: inherit;
        --font-display-weight: 400;
        --font-meta-weight: 400;
        --font-accent-weight: 400;
      }

      /*
       * Every family a preset can name must be declared HERE, statically:
       * `hyperframes check` lints this file, not the DOM, so a face added by
       * script is invisible to it and fails `font_family_without_font_face`.
       *
       * `font-family` is the name the font itself declares, not the file name.
       * Measured trap: declaring 'Baloo2' or 'SpaceGrotesk' loads the file under
       * a name no CSS rule asks for, so the preset renders in the fallback with
       * no error anywhere.
       *
       * Variable files carry a weight range; a static file carries one weight,
       * because claiming a range on a static face makes the browser fake-bold it.
       *
       * The families HyperFrames bundles (Inter, Poppins, Nunito, JetBrains
       * Mono, Space Mono, IBM Plex Mono, Montserrat, …) need no rule.
       *
       * Delete a font file this film does not use, and its rule with it.
       */
      @font-face { font-family: 'Caveat';            src: url('assets/fonts/Caveat.ttf')          format('truetype'); font-weight: 400 700; font-display: block; }
      @font-face { font-family: 'Anton';             src: url('assets/fonts/Anton.ttf')           format('truetype'); font-weight: 400;     font-display: block; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground); color: var(--ink);
        font-family: var(--font-display);
      }
      #root { position: relative; width: 1080px; height: 1920px; }

      /* Content box: x 54..1026, y 250..1536 on 1080x1920 — 13% top, 20%
         bottom, 5% on both sides. 972x1286, 60% of the frame, centre x 540 /
         y 893: horizontally the frame centre, so ordinary centring works;
         vertically 67 px high because the platforms stack their UI at the
         bottom. Anything that must be read stays above y 1382 (28% from the
         bottom, clear of a two-line caption).

         One asymmetry remains, and it is not a margin: the action rail (like /
         comment / share / audio) sits lower right, so below y 1056 (55%) the
         right edge pulls in to x 950 (88%). Above that line the full width is
         free. `npx hyperframes check` reports the ad guide's box instead
         (@hyperframes/core/dist/safeAreas.js, "Vertical-ad guides", 35% bottom
         for CTA + legal line); treat those findings as advisory.

         Backgrounds may bleed past the box; everything still keeps 4% edge. */

      .clip { position: absolute; }

      /* Register only: size, tracking, face. The position is the film's own
         decision — a hardcoded corner here put the same label in the same
         corner of every beat, which is what a template looks like.
         Set left/top per film (and vary it between beats). */
      .meta {
        /* Absolute, or every inline left/top on a text element is ignored and the
           text layer stacks in the top-left corner. Measured defect: 45/45 texts
           at x≈2 px, y≈0 in a finished MP4. */
        position: absolute;
        font-family: var(--font-meta);
        font-weight: var(--font-meta-weight);
        font-size: 28px; letter-spacing: 6px; text-transform: uppercase;
      }

      /* The card IS the word: one element, so the contrast gate measures the
         accent fill it actually renders on. Measured trap: with the accent block
         as a separate sibling behind the text, the gate read the page background
         and reported 1.01:1 for text that is plainly legible. */
      .card {
        /* Position + width are placeholders to overwrite. The accent card is a
           mechanism, not the house style: a topic that reads better as a field,
           a stack or no block at all should not keep this one. */
        left: 56px; top: 640px;
        width: 930px; min-height: 300px;
        border-radius: 16px;
        background: var(--accent);
        color: #14060a;
        font-weight: var(--font-display-weight); font-size: 104px; line-height: 1.05;
        letter-spacing: -1px;
        display: flex; align-items: center;
        padding: 24px 32px;
      }

      /*
       * The accent layer: a handwritten annotation that sits beside the display
       * word. Three registers in one frame is what stops the film reading as a
       * single-font template — display (rounded), meta (mono), accent (hand).
       * Rotated a few degrees, because a hand does not write perfectly level.
       */
      .hand {
        font-family: var(--font-accent);
        font-weight: var(--font-accent-weight);
        font-size: 64px;
        line-height: 1;
        color: var(--accent);
        transform: rotate(-4deg);
        transform-origin: left center;
      }

      .title {
        /* placeholder position: overwrite per film */
        position: absolute;
        left: 56px; top: 470px;
        font-family: var(--font-display);
        font-weight: var(--font-display-weight);
        font-size: 72px; line-height: 1.08;
      }

      /*
       * NO PROGRESS BAR BY DEFAULT.
       *
       * The rule this scaffold used to ship protected two real failures: a gap
       * between a cut and its word (a near-empty frame), and identical frames
       * the encoder reports as a freeze. Both are properties of the timeline,
       * not of one bar — so they are checked, not baked in:
       *
       *   - `freezedetect=n=0:d=1.0` must return nothing (RENDER.md §7);
       *   - every beat must fill the cut-to-word gap with something visible.
       *
       * Keep motion alive however the topic wants it: a drifting shape, a
       * breathing field, a moving camera, a real clock. A bar pinned to the
       * same y in every film is a template. If a film genuinely wants a
       * progress rule, add it and say why.
       */
      .rule { display: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.2"
      data-width="1080"
      data-height="1920"
    >
      <!--
        data-duration = last beat end (7.0 + 2.6), never the orientation cap and
        never plus a tail that no clip fills. Measured: a root of 10.5 s against
        a last beat ending at 9.6 s left 0.9 s of empty frame, and the contact
        sheet came back with two blank thumbnails.
      -->

      <!--
        ONE beat, as a demo of the mechanics — not the shape of your film.

        This used to be three beats of card + meta + hand at the same offsets,
        which is exactly the mould every film then followed. A beat is whatever
        the idea needs: one word, a diagram, an image, a shape that changes, or
        a held frame with a reason written beside it.

        What the demo does show (all of it measured, all of it required):
          - the word lands 0.08 s before it is spoken (`words.json`, not a guess);
          - the element is placed by a clip's data-start/data-duration window;
          - .clip only paints inside that window — the runtime enforces it.

        What it deliberately does NOT show: where to put anything. Positions
        below are a placeholder to overwrite; vary the zone (left / centre /
        right / edge / full) between neighbours so two beats never sit the same.
      -->
      <div id="b1card" class="clip card" data-start="1.0" data-duration="4.2" data-track-index="1" style="left: 56px; top: 640px;">ngantuk</div>

      <!-- Narration. assets/ is read by relative path. -->
      <audio id="vo" data-start="0" data-duration="5.2" data-track-index="10" src="assets/voiceover.wav"></audio>
    </div>

    <script>
      /*
       * The render contract. Every clip is positioned by ONE paused timeline,
       * registered under the root's data-composition-id.
       *
       * Measured trap: `window.__hf = {seek(t)}` produces a STATIC video with no
       * error at all — the element sat at the same x in every frame until this
       * was changed to `window.__timelines[id] = gsap.timeline()`.
       */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /*
       * One beat's mechanics, written out. Copy the pattern, not the layout.
       *
       * WORD_AT comes from audio/words.json for the word this beat says — never
       * from a word count and never from a music beat.
       */
      const WORD_AT = 1.55;            // film seconds
      const reveal = WORD_AT - 0.08;   // land just before the word is spoken

      // 1. the word arrives, on the spoken word
      tl.fromTo('#b1card',
        {opacity: 0, scale: 0.94, transformOrigin: 'left center'},
        {opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out'}, reveal);

      // 2. something moves for the whole beat. There is no progress bar in this
      //    scaffold on purpose: the defect it hid (identical frames) is caught by
      //    `freezedetect=n=0:d=1.0` on the export, and the gap before a word is
      //    filled by whatever the beat is doing. Add a bar only if the film wants
      //    one, and say why.
      tl.fromTo('#b1card', {x: 0, y: 0}, {x: 40, y: -16, duration: 4.2, ease: 'sine.inOut'}, 1.0);

      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
